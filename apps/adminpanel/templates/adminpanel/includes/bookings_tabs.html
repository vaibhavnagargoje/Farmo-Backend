{% comment %}Section tabs shown at the top of every Bookings page (mirrors the sidebar group).{% endcomment %}
{% with url_name=request.resolver_match.url_name %}
<div class="border-b border-slate-200">
    <nav class="flex items-center gap-1 overflow-x-auto -mb-px" aria-label="Bookings sections">
        <a href="{% url 'adminpanel:bookings' %}" class="whitespace-nowrap px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors {% if url_name == 'bookings' %}border-emerald-500 text-emerald-700{% else %}border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300{% endif %}">Overview</a>
        <a href="{% url 'adminpanel:bookings-list' %}" class="whitespace-nowrap px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors {% if url_name == 'bookings-list' %}border-emerald-500 text-emerald-700{% else %}border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300{% endif %}">All orders</a>
        <a href="{% url 'adminpanel:provider-contacts' %}" class="whitespace-nowrap px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors {% if url_name == 'provider-contacts' %}border-emerald-500 text-emerald-700{% else %}border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300{% endif %}">📞 Direct contacts</a>
    </nav>
</div>
{% endwith %}
