{% comment %}Params: status (Booking.Status value), label (display text).{% endcomment %}
<span class="inline-flex items-center gap-1.5 whitespace-nowrap text-[11px] font-semibold px-2 py-0.5 rounded-full border
    {% if status == 'PENDING' %}bg-yellow-50 text-yellow-800 border-yellow-200
    {% elif status == 'SEARCHING' %}bg-amber-50 text-amber-800 border-amber-200
    {% elif status == 'CONFIRMED' %}bg-sky-50 text-sky-800 border-sky-200
    {% elif status == 'IN_PROGRESS' %}bg-indigo-50 text-indigo-800 border-indigo-200
    {% elif status == 'COMPLETED' %}bg-emerald-50 text-emerald-800 border-emerald-200
    {% elif status == 'CANCELLED' or status == 'REJECTED' %}bg-rose-50 text-rose-700 border-rose-200
    {% else %}bg-slate-100 text-slate-600 border-slate-200{% endif %}">
    <span class="w-1.5 h-1.5 rounded-full
        {% if status == 'PENDING' %}bg-yellow-500
        {% elif status == 'SEARCHING' %}bg-amber-500 animate-pulse
        {% elif status == 'CONFIRMED' %}bg-sky-500
        {% elif status == 'IN_PROGRESS' %}bg-indigo-500
        {% elif status == 'COMPLETED' %}bg-emerald-500
        {% elif status == 'CANCELLED' or status == 'REJECTED' %}bg-rose-500
        {% else %}bg-slate-400{% endif %}"></span>
    {{ label }}
</span>
